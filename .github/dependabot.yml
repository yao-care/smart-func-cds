version: 2

updates:
  # workflow 的 action 已釘 commit SHA（供應鏈防護），上游修補不會自動流入。
  # Dependabot 負責補上這個缺口：更新 SHA 並同步 # vX.Y.Z 註解。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Taipei
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    # major 升級由人工評估（astro/vite/svelte 跨 major 會動到建置與 runes 行為）
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      dev-minor-patch:
        dependency-type: development
        patterns: ['*']
        update-types: [minor, patch]
      prod-minor-patch:
        dependency-type: production
        patterns: ['*']
        update-types: [minor, patch]
