# src/data/education/content-relevance.yaml
# 成人內在能力（IC）衛教內容對照表 — 單一真相源。
# build 時由 scripts/build-content-index.ts 讀取，產出 public/data/video-index.json
# 與 src/lib/education/core-articles.ts 的 CORE_ARTICLE_SLUGS（browse:true 的文章）。
#
# trigger 格式：
#   func.domain.<domain>.<band>.<ageGroup>   band ∈ {low, moderate}
#   func.triage.<category>.<ageGroup>         category ∈ {normal, observe, consult, incomplete}
# 每篇文章可標：
#   browse:true       → 進入 /education 核心清單與矩陣主文章
#   severities:[...]  → 進入 recommendations（observe / consult）；省略則僅瀏覽
